<section id="about" class="about section">
  <div class="container section-title">
    <h2>Sobre mí</h2>
    <p>{{ description }}</p>
  </div>

  <div class="container">
    <div class="row gy-4 align-items-center">
      <div class="col-lg-4">
        <img
          ngSrc="assets/img/my-profile-img.jpg"
          width="1107"
          height="1339"
          sizes="(max-width: 991px) 100vw, 33vw"
          class="img-fluid"
          [alt]="'Foto de perfil de ' + name"
        >
      </div>
      <div class="col-lg-8 content">
        <h2>{{ profession }}</h2>
        <p>{{ description }}</p>
        <ul>
          @for (area of focusAreas; track area) {
            <li>
              <i class="bi bi-chevron-right" aria-hidden="true"></i>
              <span>{{ area }}</span>
            </li>
          }
        </ul>
        <a class="btn btn-outline-primary" href="#portfolio">Ver mis proyectos</a>
      </div>
    </div>
  </div>
</section>
